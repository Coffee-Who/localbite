<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalBite - Firebase 雲端版</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js"></script>
    <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDMyoFgk8rLOSPpfnBXE5A-qLfMGxPpfcc&libraries=places"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        .app-container {
            max-width: 390px;
            margin: 20px auto;
            background: white;
            border-radius: 40px;
            box-shadow: 0 0 50px rgba(0,0,0,0.15);
            overflow: hidden;
            border: 12px solid #000;
            height: 844px;
            display: flex;
            flex-direction: column;
        }

        .app-content {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: white;
        }

        .status-bar {
            background: white;
            padding: 8px 16px;
            text-align: center;
            font-size: 12px;
            color: #333;
            border-bottom: 1px solid #f0f0f0;
        }

        .header {
            background: white;
            padding: 14px 16px;
            border-bottom: 1px solid #f5f5f5;
            flex-shrink: 0;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            font-weight: 700;
            color: #d95b37;
        }

        .auth-status {
            font-size: 10px;
            padding: 4px 8px;
            background: #e8f5e9;
            color: #2e7d32;
            border-radius: 4px;
            cursor: pointer;
            border: none;
        }

        .search-container {
            background: #f5f5f5;
            border-radius: 10px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .search-container input {
            background: none;
            border: none;
            flex: 1;
            font-size: 13px;
            outline: none;
            color: #333;
        }

        .location-bar {
            display: flex;
            gap: 8px;
        }

        .location-btn {
            flex: 1;
            background: #e8f5e9;
            color: #2e7d32;
            border: none;
            border-radius: 6px;
            padding: 8px;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            font-weight: 600;
        }

        .add-btn {
            background: #ff9800;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px 10px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .page-tabs {
            padding: 12px;
            border-bottom: 1px solid #f5f5f5;
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            flex-shrink: 0;
            overflow-x: auto;
        }

        .page-tab {
            background: white;
            border: 1px solid #ddd;
            border-radius: 18px;
            padding: 7px 12px;
            font-size: 11px;
            cursor: pointer;
            color: #333;
            font-weight: 600;
            white-space: nowrap;
        }

        .page-tab.active {
            background: #d95b37;
            color: white;
            border-color: #d95b37;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
        }

        .list-view {
            border-right: 1px solid #f5f5f5;
            overflow-y: auto;
        }

        .map-view {
            background: #e0e0e0;
            position: relative;
        }

        .page {
            display: none;
            grid-column: 1 / -1;
        }

        .page.active {
            display: block;
        }

        .page.split-view {
            grid-column: 1;
        }

        .page.split-view.map {
            grid-column: 2;
        }

        #googleMap {
            width: 100%;
            height: 100%;
        }

        .item {
            border-bottom: 1px solid #f5f5f5;
            padding: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .item:hover {
            background: #f9f9f9;
        }

        .item-name {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 3px;
        }

        .item-info {
            font-size: 11px;
            color: #999;
            margin-bottom: 4px;
        }

        .item-rating {
            display: flex;
            gap: 6px;
            font-size: 11px;
        }

        .stars {
            color: #f5a623;
            font-weight: 600;
        }

        .custom-badge {
            background: #ff9800;
            color: white;
            padding: 2px 4px;
            border-radius: 2px;
            font-size: 9px;
        }

        .form-group {
            margin-bottom: 12px;
            padding: 0 14px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 12px;
            font-family: inherit;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .form-row .form-group {
            padding: 0;
        }

        .form-actions {
            display: flex;
            gap: 8px;
            padding: 10px 14px;
            border-top: 1px solid #f5f5f5;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
        }

        .btn-submit {
            background: #28a745;
            color: white;
        }

        .btn-cancel {
            background: #f5f5f5;
            color: #333;
        }

        .empty-state {
            padding: 40px 20px;
            text-align: center;
            color: #999;
        }

        .bottom-nav {
            background: white;
            border-top: 1px solid #f0f0f0;
            padding: 8px 0;
            display: flex;
            justify-content: space-around;
            flex-shrink: 0;
        }

        .nav-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            color: #999;
            font-size: 10px;
            padding: 6px;
        }

        .nav-btn i {
            font-size: 18px;
        }

        .nav-btn.active {
            color: #d95b37;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 12px;
            max-width: 300px;
            width: 90%;
        }

        .modal-content h2 {
            font-size: 16px;
            margin-bottom: 12px;
        }

        .modal-content input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 13px;
        }

        .modal-actions {
            display: flex;
            gap: 8px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="app-content">
        
        <div class="status-bar">9:41</div>
        
        <div class="header">
            <div class="header-top">
                <div class="logo">
                    <i class="fas fa-map-pin"></i> LocalBite
                </div>
                <button class="auth-status" onclick="toggleAuthModal()" id="authBtn">登入</button>
            </div>
            <div class="search-container">
                <i class="fas fa-search" style="color: #999;"></i>
                <input type="text" id="searchInput" placeholder="搜尋食物、地點..." onkeypress="if(event.key==='Enter') search()">
            </div>
            <div class="location-bar">
                <button class="location-btn" onclick="getLocation()">
                    <i class="fas fa-location-arrow"></i><span id="locText">定位</span>
                </button>
                <button class="add-btn" onclick="showTab('add')" id="addBtn" style="display:none;">
                    <i class="fas fa-plus"></i>新增
                </button>
            </div>
        </div>

        <div class="page-tabs">
            <button class="page-tab active" onclick="showTab('home')">首頁</button>
            <button class="page-tab" onclick="showTab('add')" id="addTab" style="display:none;">新增</button>
            <button class="page-tab" onclick="showTab('map')">地圖</button>
        </div>

        <div class="content">
            <!-- Home Page -->
            <div id="home" class="page active split-view" style="grid-column: 1 / -1;">
                <div class="list-view">
                    <div id="itemsList"></div>
                </div>
            </div>

            <!-- Add Page -->
            <div id="add" class="page">
                <div style="padding: 14px;">
                    <h2 style="font-size: 14px; margin-bottom: 12px;">+ 新增景點</h2>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>國家</label>
                            <input type="text" id="fCountry" placeholder="台灣">
                        </div>
                        <div class="form-group">
                            <label>地區</label>
                            <input type="text" id="fRegion" placeholder="台北">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>名稱</label>
                        <input type="text" id="fName" placeholder="景點名稱">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>類型</label>
                            <select id="fType">
                                <option value="美食">美食</option>
                                <option value="景點">景點</option>
                                <option value="咖啡">咖啡</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>價格</label>
                            <select id="fPrice">
                                <option value="$">$</option>
                                <option value="$$">$$</option>
                                <option value="$$$">$$$</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>地址</label>
                        <input type="text" id="fAddress" placeholder="完整地址">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>緯度</label>
                            <input type="number" id="fLat" placeholder="25.0431" step="0.0001">
                        </div>
                        <div class="form-group">
                            <label>經度</label>
                            <input type="number" id="fLng" placeholder="121.5648" step="0.0001">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>描述</label>
                        <textarea id="fDesc" placeholder="特色描述..." style="min-height: 60px;"></textarea>
                    </div>
                </div>
                <div class="form-actions">
                    <button class="btn btn-cancel" onclick="showTab('home')">取消</button>
                    <button class="btn btn-submit" onclick="savePlace()">新增</button>
                </div>
            </div>

            <!-- Map Page -->
            <div id="map" class="page split-view">
                <div id="googleMap" style="width:100%; height:100%;"></div>
            </div>
        </div>

        <div class="bottom-nav">
            <button class="nav-btn active" onclick="showTab('home')"><i class="fas fa-home"></i>首頁</button>
            <button class="nav-btn" onclick="showTab('map')"><i class="fas fa-map"></i>地圖</button>
            <button class="nav-btn" onclick="showTab('home')"><i class="fas fa-heart"></i>收藏</button>
            <button class="nav-btn" onclick="showTab('add')" id="myBtn" style="display:none;"><i class="fas fa-user"></i>我的</button>
        </div>

    </div>
</div>

<!-- Auth Modal -->
<div id="authModal" class="modal">
    <div class="modal-content">
        <h2>登入/註冊</h2>
        <div id="loginForm">
            <input type="email" id="loginEmail" placeholder="電子郵件">
            <input type="password" id="loginPassword" placeholder="密碼">
            <div class="modal-actions">
                <button class="btn btn-cancel" onclick="toggleAuthModal()">關閉</button>
                <button class="btn btn-submit" onclick="login()">登入</button>
            </div>
            <p style="text-align: center; font-size: 12px; margin-top: 10px; color: #999;">
                或 <a href="#" onclick="showSignup()" style="color: #d95b37; text-decoration: none;">建立帳戶</a>
            </p>
        </div>
        <div id="signupForm" style="display: none;">
            <input type="email" id="signupEmail" placeholder="電子郵件">
            <input type="password" id="signupPassword" placeholder="密碼">
            <div class="modal-actions">
                <button class="btn btn-cancel" onclick="showLogin()">返回登入</button>
                <button class="btn btn-submit" onclick="signup()">註冊</button>
            </div>
        </div>
    </div>
</div>

<script>
    // Firebase 配置 - 需要替換為您的實際配置
    const firebaseConfig = {
        apiKey: "AIzaSyBvbz07UEwVw7K3tI4JcLcW2tXkqf_bksw",
        authDomain: "localbite-8e154.firebaseapp.com",
        databaseURL: "https://localbite-8e154-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "localbite-8e154",
        storageBucket: "localbite-8e154.firebasestorage.app",
        messagingSenderId: "798128436129",
        appId: "1:798128436129:web:b8d2ec5db4d745cb4c91e0"
    };

    let currentUser = null;
    let currentLocation = null;
    let allPlaces = [];
    let map = null;
    let markers = [];

    // 初始化 Firebase
    function initFirebase() {
        try {
            firebase.initializeApp(firebaseConfig);
            const auth = firebase.auth();
            const database = firebase.database();

            auth.onAuthStateChanged(user => {
                currentUser = user;
                updateAuthUI();
                if (user) {
                    loadPlaces();
                }
            });
        } catch (error) {
            console.log('Firebase 設定提示:', error.message);
            alert('💡 Firebase 未配置。請更新 firebaseConfig 以啟用雲端同步。\n\n目前使用本地存儲演示。');
            useLocalStorage();
        }
    }

    function useLocalStorage() {
        allPlaces = JSON.parse(localStorage.getItem('localBitePlaces') || '[]');
        updateAuthUI();
        displayPlaces();
    }

    function updateAuthUI() {
        const btn = document.getElementById('authBtn');
        const addBtn = document.getElementById('addBtn');
        const addTab = document.getElementById('addTab');
        const myBtn = document.getElementById('myBtn');

        if (currentUser) {
            btn.textContent = '已登入';
            btn.style.background = '#e8f5e9';
            addBtn.style.display = 'flex';
            addTab.style.display = 'block';
            myBtn.style.display = 'flex';
        } else {
            btn.textContent = '登入';
            btn.style.background = '#ffeaa7';
            addBtn.style.display = 'none';
            addTab.style.display = 'none';
            myBtn.style.display = 'none';
        }
    }

    function login() {
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;

        if (!currentUser) {
            alert('Firebase 未正確配置。請更新配置後再試。\n\n演示模式：自動登入');
            currentUser = { uid: 'demo-user', email: email };
            useLocalStorage();
            toggleAuthModal();
        }
    }

    function signup() {
        const email = document.getElementById('signupEmail').value;
        const password = document.getElementById('signupPassword').value;

        if (!currentUser) {
            alert('Firebase 未正確配置。\n\n演示模式：自動建立帳戶');
            currentUser = { uid: 'demo-user', email: email };
            useLocalStorage();
            toggleAuthModal();
        }
    }

    function loadPlaces() {
        if (!currentUser) return;
        
        const database = firebase.database();
        database.ref('users/' + currentUser.uid + '/places').on('value', snapshot => {
            allPlaces = [];
            if (snapshot.exists()) {
                snapshot.forEach(childSnapshot => {
                    allPlaces.push({
                        ...childSnapshot.val(),
                        id: childSnapshot.key
                    });
                });
            }
            displayPlaces();
        });
    }

    function savePlace() {
        if (!currentUser) {
            alert('請先登入');
            return;
        }

        const place = {
            name: document.getElementById('fName').value,
            country: document.getElementById('fCountry').value,
            region: document.getElementById('fRegion').value,
            type: document.getElementById('fType').value,
            price: document.getElementById('fPrice').value,
            address: document.getElementById('fAddress').value,
            lat: parseFloat(document.getElementById('fLat').value),
            lng: parseFloat(document.getElementById('fLng').value),
            desc: document.getElementById('fDesc').value,
            rating: 4.0,
            custom: true,
            createdAt: new Date().toISOString()
        };

        if (!currentUser.uid.includes('demo')) {
            const database = firebase.database();
            database.ref('users/' + currentUser.uid + '/places').push(place);
        } else {
            allPlaces.push(place);
            localStorage.setItem('localBitePlaces', JSON.stringify(allPlaces));
        }

        alert('✅ 新增成功！');
        document.getElementById('fName').value = '';
        document.getElementById('fDesc').value = '';
        showTab('home');
    }

    function getLocation() {
        if (navigator.geolocation) {
            document.getElementById('locText').textContent = '定位中...';
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    currentLocation = {
                        lat: position.coords.latitude,
                        lng: position.coords.longitude
                    };
                    document.getElementById('locText').textContent = '已定位';
                    displayPlaces();
                },
                function() {
                    currentLocation = { lat: 1.3521, lng: 103.8198 };
                    document.getElementById('locText').textContent = '已定位';
                    displayPlaces();
                }
            );
        }
    }

    function search() {
        displayPlaces();
    }

    function displayPlaces() {
        const keyword = document.getElementById('searchInput').value.toLowerCase();
        let results = allPlaces.filter(p => 
            p.name.toLowerCase().includes(keyword) ||
            p.type.toLowerCase().includes(keyword)
        );

        document.getElementById('itemsList').innerHTML = results.length ? results.map(p => `
            <div class="item" onclick="showOnMap(${p.lat}, ${p.lng}, '${p.name}')">
                <div class="item-name">${p.name} ${p.custom ? '<span class="custom-badge">自訂</span>' : ''}</div>
                <div class="item-info">${p.type} · ${p.price} · ${p.region}</div>
                <div class="item-rating">
                    <span class="stars">★ ${p.rating || 4.0}</span>
                    ${currentLocation ? `<span>(距離: ${calculateDistance(currentLocation.lat, currentLocation.lng, p.lat, p.lng).toFixed(2)}km)</span>` : ''}
                </div>
            </div>
        `).join('') : '<div class="empty-state"><i class="fas fa-search" style="font-size:40px;"></i><p>無搜尋結果</p></div>';
    }

    function calculateDistance(lat1, lng1, lat2, lng2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLng = (lng2 - lng1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLng/2) * Math.sin(dLng/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c;
    }

    function showTab(tab) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(tab).classList.add('active');

        if (tab === 'map') {
            setTimeout(initMap, 100);
        }
    }

    function initMap() {
        if (!map) {
            const defaultLocation = currentLocation || { lat: 1.3521, lng: 103.8198 };
            map = new google.maps.Map(document.getElementById('googleMap'), {
                zoom: 13,
                center: defaultLocation
            });
        }

        clearMarkers();
        const keyword = document.getElementById('searchInput').value.toLowerCase();
        let results = allPlaces.filter(p => 
            p.name.toLowerCase().includes(keyword) ||
            p.type.toLowerCase().includes(keyword)
        );

        results.forEach(place => {
            const marker = new google.maps.Marker({
                position: { lat: place.lat, lng: place.lng },
                map: map,
                title: place.name,
                icon: getMarkerIcon(place.custom)
            });

            marker.infoWindow = new google.maps.InfoWindow({
                content: `<div style="padding:8px;"><strong>${place.name}</strong><br>${place.address}</div>`
            });

            marker.addListener('click', () => {
                closeAllInfoWindows();
                marker.infoWindow.open(map, marker);
            });

            markers.push(marker);
        });

        if (currentLocation) {
            new google.maps.Marker({
                position: currentLocation,
                map: map,
                title: '我的位置',
                icon: 'http://maps.google.com/mapfiles/ms/icons/blue-dot.png'
            });
        }
    }

    function getMarkerIcon(isCustom) {
        return isCustom ? 'http://maps.google.com/mapfiles/ms/icons/orange-dot.png' : 'http://maps.google.com/mapfiles/ms/icons/red-dot.png';
    }

    function clearMarkers() {
        markers.forEach(m => m.setMap(null));
        markers = [];
    }

    function closeAllInfoWindows() {
        markers.forEach(m => m.infoWindow?.close());
    }

    function showOnMap(lat, lng, name) {
        showTab('map');
        setTimeout(() => {
            if (map) {
                map.setCenter({ lat, lng });
                map.setZoom(15);
            }
        }, 100);
    }

    function toggleAuthModal() {
        document.getElementById('authModal').classList.toggle('active');
    }

    function showSignup() {
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('signupForm').style.display = 'block';
    }

    function showLogin() {
        document.getElementById('loginForm').style.display = 'block';
        document.getElementById('signupForm').style.display = 'none';
    }

    // 初始化
    initFirebase();
</script>

</body>
</html>
