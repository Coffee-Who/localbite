<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalBite - 發現在地好味道</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDMyoFgk8rLOSPpfnBXE5A-qLfMGxPpfcc&libraries=places"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #333; }
        .app-container { max-width: 390px; margin: 20px auto; background: white; border-radius: 40px; box-shadow: 0 0 50px rgba(0,0,0,0.15); overflow: hidden; border: 12px solid #000; height: 844px; display: flex; flex-direction: column; }
        .app-content { width: 100%; height: 100%; display: flex; flex-direction: column; background: white; }
        .status-bar { background: white; padding: 8px 16px; text-align: center; font-size: 12px; color: #333; border-bottom: 1px solid #f0f0f0; }
        .header { background: white; padding: 14px 16px; border-bottom: 1px solid #f5f5f5; flex-shrink: 0; }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .logo { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 700; color: #d95b37; }
        .header-right { display: flex; align-items: center; gap: 8px; }
        .header-btn { background: none; border: none; cursor: pointer; color: #666; font-size: 18px; }
        .sync-status { font-size: 10px; color: #2e7d32; background: #e8f5e9; padding: 2px 6px; border-radius: 4px; font-weight: 600; display: none; }
        .search-container { background: #f5f5f5; border-radius: 10px; padding: 10px 12px; display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
        .search-container i { font-size: 16px; color: #999; }
        .search-container input { background: none; border: none; flex: 1; font-size: 13px; outline: none; color: #333; }
        .search-container input::placeholder { color: #999; }
        .search-btn { background: #d95b37; border: none; border-radius: 8px; color: white; cursor: pointer; font-size: 14px; padding: 4px 10px; flex-shrink: 0; }
        .location-bar { display: flex; gap: 8px; }
        .location-btn { flex: 1; background: #e8f5e9; color: #2e7d32; border: none; border-radius: 6px; padding: 8px; font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px; font-weight: 600; }
        .add-place-btn { background: #ff9800; color: white; border: none; border-radius: 6px; padding: 8px 10px; cursor: pointer; font-size: 11px; font-weight: 600; display: flex; align-items: center; gap: 4px; }
        .page-tabs { padding: 12px; border-bottom: 1px solid #f5f5f5; display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; flex-shrink: 0; }
        .page-tab { background: white; border: 1px solid #ddd; border-radius: 18px; padding: 7px 10px; font-size: 11px; cursor: pointer; color: #333; font-weight: 600; }
        .page-tab.active { background: #d95b37; color: white; border-color: #d95b37; }
        .quick-tags { padding: 12px; border-bottom: 1px solid #f5f5f5; overflow-x: auto; white-space: nowrap; flex-shrink: 0; }
        .tag-list { display: inline-flex; gap: 8px; }
        .tag { background: #f5f5f5; color: #333; border: none; border-radius: 16px; padding: 7px 13px; font-size: 12px; cursor: pointer; flex-shrink: 0; }
        .tag.active { background: #d95b37; color: white; font-weight: 600; }
        .filter-panel { background: white; border-bottom: 1px solid #f5f5f5; padding: 10px 14px; flex-shrink: 0; }
        .filter-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-size: 12px; font-weight: 600; color: #d95b37; }
        .filter-content { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px solid #f5f5f5; }
        .filter-content.show { display: block; }
        .distance-item { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 12px; }
        .content { flex: 1; overflow-y: auto; }
        .page { display: none; }
        .page.active { display: block; }
        #map.page { height: 100%; display: none; }
        #map.page.active { display: block; }
        #googleMap { width: 100%; height: 100%; min-height: 450px; }
        .item { border-bottom: 1px solid #f5f5f5; }
        .item-image { width: 100%; height: 140px; background: linear-gradient(135deg, #e8c8b0 0%, #d4a574 100%); display: flex; align-items: center; justify-content: center; font-size: 40px; position: relative; }
        .rating-badge { position: absolute; top: 8px; right: 8px; background: #d95b37; color: white; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
        .distance-label { position: absolute; bottom: 8px; right: 8px; background: #0099ff; color: white; padding: 3px 6px; border-radius: 3px; font-size: 10px; }
        .item-info { padding: 11px 13px; }
        .item-name { font-size: 15px; font-weight: 600; margin-bottom: 3px; }
        .item-rating { display: flex; gap: 6px; align-items: center; margin-bottom: 5px; font-size: 11px; }
        .stars { color: #f5a623; font-weight: 600; }
        .item-location { font-size: 11px; color: #999; margin-bottom: 6px; }
        .item-desc { font-size: 11px; color: #666; margin-bottom: 8px; }
        .item-buttons { display: flex; gap: 6px; }
        .btn { flex: 1; padding: 8px; border: none; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: 600; }
        .btn-detail { background: white; color: #333; border: 1px solid #ddd; }
        .btn-route { background: #d95b37; color: white; }
        .btn-delete { background: white; color: #d95b37; border: 1px solid #d95b37; }
        .form-section { padding: 14px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; font-weight: 600; color: #333; margin-bottom: 6px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 12px; font-family: inherit; }
        .form-group textarea { min-height: 60px; }
        .form-actions { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid #f5f5f5; }
        .btn-submit { flex: 1; padding: 10px; background: #28a745; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 12px; }
        .btn-cancel { flex: 1; padding: 10px; background: #f5f5f5; color: #333; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 12px; }
        .empty-state { padding: 40px 20px; text-align: center; color: #999; }
        .empty-state i { font-size: 40px; margin-bottom: 10px; }
        .bottom-nav { background: white; border-top: 1px solid #f0f0f0; padding: 8px 0; display: flex; justify-content: space-around; flex-shrink: 0; }
        .nav-btn { background: none; border: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; color: #999; font-size: 10px; padding: 6px; }
        .nav-btn i { font-size: 18px; }
        .nav-btn.active { color: #d95b37; }
        .custom-badge { background: #ff9800; color: white; padding: 2px 6px; border-radius: 3px; font-size: 10px; font-weight: 600; }
        .cloud-badge { background: #e3f2fd; color: #1565c0; padding: 2px 6px; border-radius: 3px; font-size: 10px; font-weight: 600; }
        .info-box { background: #f0f7ff; border: 1px solid #b3d9ff; border-radius: 6px; padding: 10px; margin: 10px 0; font-size: 11px; color: #0099ff; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal { background: white; border-radius: 16px; padding: 24px; width: 320px; max-width: 90vw; }
        .modal h3 { font-size: 16px; margin-bottom: 16px; color: #d95b37; }
        .modal input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; margin-bottom: 10px; box-sizing: border-box; font-family: inherit; }
        .modal-actions { display: flex; gap: 8px; margin-top: 4px; }
        .modal-switch { text-align: center; margin-top: 12px; font-size: 12px; color: #666; }
        .modal-switch a { color: #d95b37; cursor: pointer; text-decoration: none; }
        .btn-logout { flex: 1; padding: 10px; background: #dc3545; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 12px; }
        .user-info-box { background: #f0f7ff; border-radius: 8px; padding: 10px; margin-bottom: 16px; font-size: 12px; }
        .user-info-box strong { display: block; margin-bottom: 4px; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="app-content">
        <div class="status-bar">9:41</div>
        <div class="header">
            <div class="header-top">
                <div class="logo"><i class="fas fa-map-pin"></i>LocalBite</div>
                <div class="header-right">
                    <span class="sync-status" id="syncStatus">☁️ 已同步</span>
                    <button class="header-btn" id="authBtn" onclick="toggleAuthModal()"><i class="fas fa-user"></i></button>
                    <button class="header-btn" onclick="showTab('add', event)"><i class="fas fa-plus"></i></button>
                </div>
            </div>
            <div class="search-container">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="搜尋食物、地點..." onkeypress="if(event.key==='Enter') search()">
                <button class="search-btn" onclick="search()"><i class="fas fa-search"></i></button>
            </div>
            <div class="location-bar">
                <button class="location-btn" onclick="getLocation()">
                    <i class="fas fa-location-arrow"></i><span id="locText">使用我的位置</span>
                </button>
                <button class="add-place-btn" onclick="showTab('add', event)"><i class="fas fa-plus"></i>新增</button>
            </div>
        </div>

        <div class="page-tabs">
            <button class="page-tab active" onclick="showTab('home', event)">首頁搜尋</button>
            <button class="page-tab" onclick="showTab('add', event)">新增景點</button>
            <button class="page-tab" onclick="showTab('filter', event)">距離篩選</button>
            <button class="page-tab" onclick="showTab('myplaces', event)">我的地點</button>
            <button class="page-tab" onclick="showTab('map', event)">地圖</button>
        </div>

        <div id="quickTagsSection" class="quick-tags">
            <div class="tag-list">
                <button class="tag active" onclick="filterByTag('全部', event)">🍽️ 全部</button>
                <button class="tag" onclick="filterByTag('肉骨茶', event)">🍲 肉骨茶</button>
                <button class="tag" onclick="filterByTag('咖啡', event)">☕ 咖啡</button>
                <button class="tag" onclick="filterByTag('景點', event)">🏛️ 景點</button>
                <button class="tag" onclick="filterByTag('小吃', event)">🍜 小吃</button>
            </div>
        </div>

        <div id="filterSection" class="filter-panel">
            <div class="filter-header" onclick="toggleFilter()">
                <span><i class="fas fa-sliders-h"></i> 距離篩選</span>
                <span id="filterToggle">▼</span>
            </div>
            <div class="filter-content" id="filterContent">
                <div class="distance-item"><input type="radio" name="distance" value="all" checked onchange="applyFilter()"> <label>全部</label></div>
                <div class="distance-item"><input type="radio" name="distance" value="200" onchange="applyFilter()"> <label>200 公尺</label></div>
                <div class="distance-item"><input type="radio" name="distance" value="500" onchange="applyFilter()"> <label>500 公尺</label></div>
                <div class="distance-item"><input type="radio" name="distance" value="1000" onchange="applyFilter()"> <label>1 公里</label></div>
                <div class="distance-item"><input type="radio" name="distance" value="2000" onchange="applyFilter()"> <label>2 公里</label></div>
                <div class="distance-item"><input type="radio" name="distance" value="5000" onchange="applyFilter()"> <label>5 公里</label></div>
            </div>
        </div>

        <div class="content">
            <div id="home" class="page active"></div>
            <div id="add" class="page">
                <div class="form-section">
                    <h2 style="font-size: 14px; margin-bottom: 16px;">+ 新增景點或美食</h2>
                    <div class="form-row">
                        <div class="form-group"><label>國家</label><input type="text" id="fCountry" placeholder="台灣"></div>
                        <div class="form-group"><label>地區</label><input type="text" id="fRegion" placeholder="台北"></div>
                    </div>
                    <div class="form-group"><label>名稱</label><input type="text" id="fName" placeholder="景點名稱"></div>
                    <div class="form-row">
                        <div class="form-group"><label>類型</label><select id="fType"><option>美食</option><option>景點</option><option>咖啡</option><option>肉骨茶</option><option>小吃</option></select></div>
                        <div class="form
